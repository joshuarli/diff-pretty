[package]
name = "diff-pretty"
version = "0.0.1"
edition = "2024"

[workspace]
members = ["scrl"]
resolver = "2"

[features]
bench-internals = []

[dependencies]
regex-lite = "0.1.9"
scrl = { path = "scrl" }

[dev-dependencies]
divan = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "pipe", "termios"] }

[[bench]]
name = "bench"
harness = false
required-features = ["bench-internals"]

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
