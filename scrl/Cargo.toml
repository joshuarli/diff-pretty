[package]
name = "scrl"
version = "0.0.1"
edition = "2024"

[features]
default = ["terminal"]
terminal = ["dep:rustix"]

[dependencies]
regex-lite = "0.1.9"
unicode-width = "0.2"
rustix = { version = "1.1", optional = true, features = ["termios"] }

[dev-dependencies]
rustybench = "0.1"

[[bin]]
name = "scrl"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false
